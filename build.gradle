//  Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10"
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48'
    }
}

plugins {
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.hilt.android) apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://maven.scijava.org/content/repositories/public"
        }
    }
    
    // Force consistent Kotlin versions to avoid conflicts
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.10"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.10"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
            
            // Exclude conflicting kotlin stdlib versions
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useVersion '1.7.10'
                    details.because 'Force consistent Kotlin version'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

project.ext.preDexLibs = !project.hasProperty('disablePreDex')

subprojects {
    project.plugins.whenPluginAdded { plugin ->
        if ("com.android.build.gradle.AppPlugin".equals(plugin.class.name)) {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        } else if ("com.android.build.gradle.LibraryPlugin".equals(plugin.class.name)) {
            project.android.dexOptions.preDexLibraries = rootProject.ext.preDexLibs
        }
        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
            // Work around Robolectric Java 11 issues.
            android.testOptions.unitTests.all {
                // https://github.com/robolectric/robolectric/issues/5115
                systemProperty 'javax.net.ssl.trustStoreType', 'JKS'

                // https://github.com/robolectric/robolectric/issues/5456
                systemProperty 'robolectric.dependency.repo.id', 'central'
                systemProperty 'robolectric.dependency.repo.url', 'https://repo1.maven.org/maven2'
            }
        }
    }
}

tasks.matching {it instanceof Test}.all {
    testLogging.events = ["failed", "passed", "skipped"]
}