//  Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.hilt.android) apply false
}

subprojects {
    // Force consistent Kotlin versions to avoid conflicts
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

            // Exclude conflicting kotlin stdlib versions
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useVersion '1.9.24'
                    details.because 'Force consistent Kotlin version'
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}

subprojects {
    project.plugins.whenPluginAdded { plugin ->
        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
            // Work around Robolectric Java 11 issues.
            android.testOptions.unitTests.all {
                // https://github.com/robolectric/robolectric/issues/5115
                systemProperty 'javax.net.ssl.trustStoreType', 'JKS'

                // https://github.com/robolectric/robolectric/issues/5456
                systemProperty 'robolectric.dependency.repo.id', 'central'
                systemProperty 'robolectric.dependency.repo.url', 'https://repo1.maven.org/maven2'
            }
        }
    }
}

tasks.matching {it instanceof Test}.all {
    testLogging.events = ["failed", "passed", "skipped"]
}