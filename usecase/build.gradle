plugins {
    id 'com.android.library'
    alias(libs.plugins.kotlin.android)
    id 'kotlin-kapt'
    alias(libs.plugins.hilt.android)
}

android {
    compileSdk libs.versions.compileSdk.get().toInteger()
    namespace 'ru.orangesoftware.financisto.usecase'
    
    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':core:common')
    implementation project(':repository')
    implementation libs.bundles.kotlin
    
    // Dependency Injection
    implementation libs.bundles.hilt
    kapt libs.hilt.compiler
    
    // Coroutines
    implementation libs.bundles.coroutines
    
    // Reactive streams (legacy - keeping for coexistence)
    implementation libs.bundles.rxjava.bundle
    
    // Testing
    testImplementation libs.bundles.testing.modern
    
    // For Hilt testing annotation processor
    kaptTest libs.hilt.compiler
}
