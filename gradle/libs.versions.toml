[versions]
# Android SDK Versions
compileSdk = "34"
minSdk = "19"
targetSdk = "34"

# App Version
versionCode = "122"
versionName = "1.8.3"

# Build Tools
androidGradlePlugin = "7.3.0"
kotlin = "1.7.10"
kotlinCoroutines = "1.6.4"

# AndroidX
androidxLegacySupport = "1.0.0"
androidxAppcompat = "1.1.0"
androidxMultidex = "2.0.1"
androidxTestCore = "1.2.0"

# Modern AndroidX Architecture Components
androidxLifecycle = "2.6.2"
androidxViewModel = "2.6.2"
androidxLivedata = "2.6.2"
androidxNavigation = "2.7.2"
androidxRoom = "2.4.3"
androidxFragment = "1.6.1"

# Hilt Dependency Injection
hilt = "2.48"
hiltAndroidxCompiler = "1.0.0"

# Google Play Services
playServicesBase = "11.0.2"
playServicesDrive = "11.0.2"
playServicesPlus = "11.0.2"

# Android Annotations
androidAnnotations = "4.6.0"

# Third-party Libraries
gson = "2.8.5"
trove4j = "3.0.3"
dropboxSdk = "3.0.8"
okhttp = "3.10.0"
okio = "1.14.0"
eventbus = "3.1.1"
materialDatetimePicker = "3.6.4"
commonsIo = "2.5"
rxjava = "2.2.2"
rxandroid = "2.1.0"
reactiveStreams = "1.0.2"
glide = "4.10.0"

# Testing
junit = "4.12"
robolectric = "4.2.1"

# Kotlin
kotlinStdlib = "1.7.10"

# Other
compose = "1.3.3"
anvil = "2.4.2"

[libraries]
# AndroidX
androidx-legacy-support-v4 = { group = "androidx.legacy", name = "legacy-support-v4", version.ref = "androidxLegacySupport" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-multidex = { group = "androidx.multidex", name = "multidex", version.ref = "androidxMultidex" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

# Google Play Services
play-services-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "playServicesBase" }
play-services-drive = { group = "com.google.android.gms", name = "play-services-drive", version.ref = "playServicesDrive" }
play-services-plus = { group = "com.google.android.gms", name = "play-services-plus", version.ref = "playServicesPlus" }

# Android Annotations
androidannotations = { group = "org.androidannotations", name = "androidannotations", version.ref = "androidAnnotations" }
androidannotations-api = { group = "org.androidannotations", name = "androidannotations-api", version.ref = "androidAnnotations" }

# Third-party Libraries
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
trove4j = { group = "net.sf.trove4j", name = "trove4j", version.ref = "trove4j" }
dropbox-core-sdk = { group = "com.dropbox.core", name = "dropbox-core-sdk", version.ref = "dropboxSdk" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
material-datetimepicker = { group = "com.wdullaer", name = "materialdatetimepicker", version.ref = "materialDatetimePicker" }
commons-io = { group = "commons-io", name = "commons-io", version.ref = "commonsIo" }
rxjava = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxjava" }
rxandroid = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxandroid" }
reactive-streams = { group = "org.reactivestreams", name = "reactive-streams", version.ref = "reactiveStreams" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlin-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }

# Modern AndroidX Architecture Components
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "androidxLivedata" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "androidxLifecycle" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidxNavigation" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidxRoom" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "androidxRoom" }

# Hilt Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltAndroidxCompiler" }

[bundles]
kotlin = ["kotlin-stdlib", "kotlin-coroutines-core", "kotlin-coroutines-android"]
play-services = ["play-services-base", "play-services-drive", "play-services-plus"]
rxjava-bundle = ["rxjava", "rxandroid", "reactive-streams"]
testing = ["junit", "androidx-test-core", "robolectric"]

# Modern Architecture Component Bundles
lifecycle = ["androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-livedata-ktx", "androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel-savedstate"]
navigation = ["androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx", "androidx-fragment-ktx"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
hilt = ["hilt-android"]
coroutines = ["kotlin-coroutines-core", "kotlin-coroutines-android"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
anvil = { id = "com.squareup.anvil", version.ref = "anvil" }
