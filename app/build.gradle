// noinspection GradleCompatible
repositories {
    google()
    jcenter()
    maven { url 'https://jitpack.io' }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "ru.orangesoftware.financisto"
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.versionCode.get().toInteger()
        versionName libs.versions.versionName.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "androidManifestFile": "$projectDir/src/main/AndroidManifest.xml".toString()
                ]
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs 'src/main/java'
            }
            kotlin {
                srcDirs 'src/main/kotlin'
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            shrinkResources true
            minifyEnabled true
            crunchPngs true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

    sourceSets {
        test {
            resources.srcDirs += ['src/test/resources']
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1']
        }
    }

    namespace 'ru.orangesoftware.financisto'
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Module dependencies
    implementation project(':core:common')
    implementation project(':core:ui')
    implementation project(':repository')
    implementation project(':usecase')
    
    // Kotlin dependencies for modernization
    implementation libs.kotlin.stdlib
    implementation libs.bundles.coroutines
    
    // Modern Android Architecture Components
    implementation libs.bundles.lifecycle
    implementation libs.bundles.navigation
    implementation libs.bundles.room
    kapt libs.androidx.room.compiler
    
    // Hilt Dependency Injection (new - coexisting with Android Annotations)
    implementation libs.bundles.hilt
    kapt libs.hilt.compiler
    kapt libs.androidx.hilt.compiler
    
    // Legacy AndroidX support
    implementation libs.androidx.legacy.support.v4
    implementation libs.androidx.appcompat
    implementation libs.androidx.multidex

    implementation libs.bundles.play.services

    // Android Annotations (legacy - keeping for coexistence)
    kapt libs.androidannotations
    implementation libs.androidannotations.api

    implementation libs.gson
    implementation libs.trove4j

    implementation libs.dropbox.core.sdk
    implementation libs.okhttp
    implementation libs.okio
    implementation libs.eventbus
    implementation libs.material.datetimepicker
    implementation libs.commons.io
    implementation libs.bundles.rxjava.bundle
    implementation libs.glide

    implementation fileTree(include: '**/*.jar', dir: 'libs')

    testImplementation libs.bundles.testing
}